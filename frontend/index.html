<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LogLlamalyzer</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="container">

        <header class="header">

            <h1>LogLlamalyzer</h1>

            <p>
                AI-Powered Security Log Analysis
            </p>

        </header>


        <section class="query-section">

            <label for="query">
                Security Query
            </label>

            <textarea
                id="query"
                placeholder="Enter a security query..."
                rows="5"
            ></textarea>


            <label
                for="source"
                class="source-label"
            >
                Log Source
            </label>

            <select
                id="source"
            >

                <option value="">
                    All synchronized sources
                </option>

                <option value="server-a">
                    server-a
                </option>

                <option value="server-b">
                    server-b
                </option>

                <option value="server-c">
                    server-c
                </option>

            </select>


            <button
                id="analyze-button"
                type="button"
            >
                Analyse Security
            </button>


            <p
                id="status"
                class="status"
            ></p>

        </section>


        <section class="result-section">

            <h2>
                Security Analysis
            </h2>


            <div
                id="result-metadata"
                class="result-metadata"
            >

                <div class="metadata-item">

                    <span class="metadata-label">
                        Source
                    </span>

                    <span
                        id="metadata-source"
                        class="metadata-value"
                    >
                        All sources
                    </span>

                </div>


                <div class="metadata-item">

                    <span class="metadata-label">
                        Log Evidence
                    </span>

                    <span
                        id="metadata-logs"
                        class="metadata-value"
                    >
                        0
                    </span>

                </div>


                <div class="metadata-item">

                    <span class="metadata-label">
                        Knowledge Evidence
                    </span>

                    <span
                        id="metadata-knowledge"
                        class="metadata-value"
                    >
                        0
                    </span>

                </div>

            </div>


            <div
                id="result"
                class="result"
            >
                Analysis results will appear here.
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
